$kind: http-request
url: http://localhost:8080/api/v1/transactions
method: POST
body:
  type: json
  content: |-
    {
      "senderAccountId": 2,
      "receiverAccountId": 1,
      "description": "Zakgeld",
      "amount": 25,
      "currency": "GBP"
    }
scripts:
  - type: beforeRequest
    code: "// Haal het saldo van de verzender op (accountId = 2)\r

      pm.sendRequest({\r

      \    url: pm.collectionVariables.get('base_url') + '/api/v1/accounts/2',\r

      \    method: 'GET'\r

      }, function(err, response) {\r

      \    if (!err) {\r

      \        const saldo = response.json().balance;\r

      \        pm.collectionVariables.set('saldo_voor_overboeken', saldo);\r

      \    }\r

      });"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Verwachting: Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Valuta veld is gelijk aan andere valuta (bijv GBP)", function () {
          pm.expect(body.currency).to.be.equal("GBP");
      });
    language: text/javascript
examples: .resources/Geld overboeken met andere valuta.resources/examples
order: 4470889034894607
