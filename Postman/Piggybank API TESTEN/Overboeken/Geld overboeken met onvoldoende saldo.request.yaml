$kind: http-request
url: http://localhost:8080/api/v1/transactions
method: POST
body:
  type: json
  content: |-
    {
      "senderAccountId": 1,
      "receiverAccountId": 2,
      "description": "zakgeld",
      "amount": 100,
      "currency": "USD"
    }
scripts:
  - type: beforeRequest
    code: "// Haal het saldo van de verzender op (accountId = 1)\r

      pm.sendRequest({\r

      \    url: pm.collectionVariables.get('base_url') + '/api/v1/accounts/1',\r

      \    method: 'GET'\r

      }, function(err, response) {\r

      \    if (!err) {\r

      \        const saldo = response.json().balance;\r

      \        pm.collectionVariables.set('saldo_voor_overboeken', saldo);\r

      \    }\r

      });"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Verwachting: Status code is 400 Bad request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Verzender heeft minder dan $0 saldo", function () {
          const saldo = parseFloat(pm.collectionVariables.get('saldo_voor_overboeken'));
          pm.expect(saldo).to.be.below(0);
      });
    language: text/javascript
examples: .resources/Geld overboeken met onvoldoende saldo.resources/examples
